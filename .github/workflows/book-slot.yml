name: Book Goethe Slot

# ─────────────────────────────────────────────────────────────
#  FREE Goethe booking runner (GitHub Actions)
#  Runs on GitHub's cloud runners (clean IP, not blocked by Goethe)
#
#  SETUP (5 min, free):
#   1. Push this repo to GitHub (Public)
#   2. Settings → Secrets and variables → Actions → New repository secret:
#        - CONFIG_CSV      = the FULL content of your config.csv
#                            (name,email,password,level,city,dob,booking_datetime,...)
#      (On Windows PowerShell copy with a header row; see config.example.csv)
#   3. This workflow runs the bot when you trigger it manually
#      (or via scheduled cron below when a slot is expected)
#
#  To run: Actions tab → "Book Goethe Slot" → "Run workflow"
#
#  IMPORTANT — the scheduler:
#   * The bot's booking_datetime means "wait until this time, then book".
#   * GitHub Actions kills a run after 15 min, so a run started before
#     booking_datetime will TIME OUT and do nothing.
#   * So the workflow ALWAYS passes --immediate (don't wait; book right now).
#     Use the schedule below so the run fires DURING your booking window.
#   * Timezone everywhere is Asia/Karachi (set by TZ env below), so write
#     cron times in Pakistan local time.
#     Example: slot opens 11:12 PKT daily → cron: 7,12,17 11 * * *  (11:07,11:12,11:17 PKT)
#
#  Probe mode:
#   * Check "probe only" when you want to test whether the runner's IP can
#     reach www.goethe.de and see "Book Now" — WITHOUT booking.
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:        # manual trigger (click "Run workflow")
    inputs:
      probe_only:
        description: 'Probe only — check slots/page reachable (no booking)'
        required: false
        type: boolean
        default: false
      immediate:
        description: 'Book now, skip waiting until booking_datetime (recommended for Actions)'
        required: false
        type: boolean
        default: true
  schedule:
    # ── EDIT THIS to your booking window (Pakistan local time) ──
    # 5 fields: minute hour dom month dow
    # Example: every 5 min during 11:05-11:20 PKT:
    - cron: "5,10,15,20 11 * * *"   # change to your actual window

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Karachi
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends google-chrome-stable unzip
          pip install -r requirements.txt

      - name: Write config.csv from secret
        run: |
          echo "$CONFIG_CSV" > config.csv
          echo "config.csv written ($(wc -l < config.csv) lines)"
          head -1 config.csv
        env:
          CONFIG_CSV: ${{ secrets.CONFIG_CSV }}

      - name: Run booking bot (headless)
        run: |
          if [ "${{ inputs.probe_only }}" = "true" ]; then
            python booking_helper.py --config config.csv --check-only
          else
            python booking_helper.py --config config.csv --headless true ${{ inputs.immediate == 'true' && '--immediate' || '' }}
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Show result
        if: always()
        run: |
          ls -la bot_logs.ndjson 2>/dev/null && tail -30 bot_logs.ndjson || true
          ls -la *.png 2>/dev/null || true